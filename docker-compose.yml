version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 5000
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: greenplus
      JWT_SECRET: change-me-to-a-long-random-secret
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
